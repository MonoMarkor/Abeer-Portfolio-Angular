<header class="header">
  <div class="header__inner">
    <a class="header__logo" href="#top">Ahmad Abeer Ahsan</a>

    <nav class="header__nav">
      @for (link of navLinks; track link.fragment) {
        <a class="header__link" [href]="'#' + link.fragment">
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>
